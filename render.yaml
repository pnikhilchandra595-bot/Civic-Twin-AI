services:
  - type: web
    name: civictwin-ai-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: COPERNICUS_CLIENT_ID
        sync: false
      - key: COPERNICUS_CLIENT_SECRET
        sync: false
      - key: NASA_FIRMS_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false
      - key: FAST2SMS_API_KEY
        sync: false
      - key: BHUVAN_HOSPITAL_POSTAL_KEY
        sync: false
      - key: BHUVAN_VILLAGE_GEOCODE_KEY
        sync: false
      - key: BHUVAN_LULC_STATICS_KEY
        sync: false
      - key: BHUVAN_LULC_AOI_KEY
        sync: false
      - key: BHUVAN_ROUTING_KEY
        sync: false
      - key: BHUVAN_GEOID_KEY
        sync: false
      - key: DELHI_OTD_API_KEY
        value: "gmnSpSaKqninoz0DQqF0ew2DhgCLPB1B"
      - key: PURPLEAIR_API_KEY
        value: "5817167C-A095-11F1-9E30-4201AC1DC129"

